[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blockchain-tcc"
version = "1.0.0"
description = "Protótipo local de integridade e rastreabilidade de dados IoT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography==50.0.2",
    "Flask==3.1.3",
    "waitress==3.0.2",
]

[project.optional-dependencies]
graficos = ["matplotlib==3.10.8"]

[project.scripts]
blockchain-servidor = "blockchain_tcc.iniciar_api:main"
blockchain-preparar = "blockchain_tcc.preparar_demo_api:main"
blockchain-simulador = "blockchain_tcc.simulador_iot:main"
blockchain-cliente = "blockchain_tcc.cliente_api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blockchain_tcc = ["painel/templates/*.html", "painel/static/*.css", "painel/static/*.js", "painel/static/*.svg"]
